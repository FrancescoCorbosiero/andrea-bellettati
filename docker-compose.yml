# =====================================================================
# Deploy con Caddy (caddy-docker-proxy: lucaslorentz/caddy-docker-proxy),
# come il sito Astro. Caddy gira in un suo container sulla rete esterna
# "caddy", legge queste label, prende i certificati HTTPS e fa da proxy.
#
#   docker network create caddy        # una volta sola, se non esiste
#   cp .env.example .env               # e compila dominio + credenziali SES
#   docker compose up -d --build
# =====================================================================
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: andrea-bellettati:latest
    container_name: andrea-bellettati
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy
    expose:
      - "3000"
    labels:
      # Dominio principale → il server Next.js.
      caddy: ${SITE_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      caddy.header.-Server: ""
      # Dominio alternativo (es. www) → redirect permanente al principale.
      caddy_1: ${SITE_DOMAIN_ALT}
      caddy_1.redir: "https://${SITE_DOMAIN}{uri} permanent"

networks:
  caddy:
    external: true
