# =====================================================================
# Deploy con Caddy (caddy-docker-proxy: lucaslorentz/caddy-docker-proxy),
# come il sito Astro. Caddy gira in un suo container sulla rete esterna
# "caddy", legge queste label, prende i certificati HTTPS e fa da proxy.
#
#   docker network create caddy        # una volta sola, se non esiste
#   cp .env.example .env               # e compila dominio + credenziali SES
#   docker compose up -d --build       # con Cloudflare svuota anche la cache
# =====================================================================
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: andrea-bellettati:latest
    container_name: andrea-bellettati
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy
    expose:
      - "3000"
    labels:
      # Dominio principale → il server Next.js.
      caddy: ${SITE_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      caddy.header.-Server: ""
      # Dominio alternativo (es. www) → redirect permanente al principale.
      caddy_1: ${SITE_DOMAIN_ALT}
      caddy_1.redir: "https://${SITE_DOMAIN}{uri} permanent"

  # Cloudflare davanti al sito (facoltativo, docs/cloudflare.md). Parte da solo
  # a ogni "docker compose up -d --build": quando il sito nuovo risponde anche
  # dal dominio pubblico allinea regole di cache e impostazioni della zona, poi
  # svuota la cache (solo se la build è cambiata). Senza
  # deploy/cloudflare/cloudflare.env non fa nulla.
  # Log: docker compose logs cloudflare · A mano: docker compose run --rm cloudflare svuota
  cloudflare:
    image: node:22-alpine
    entrypoint: ["node", "/cloudflare/sync.mjs"]
    command: ["deploy"]
    volumes:
      - ./deploy/cloudflare:/cloudflare:ro
      - cloudflare-stato:/stato
    env_file:
      - path: ./deploy/cloudflare/cloudflare.env
        required: false
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ORIGIN_URL: http://web:3000
    networks:
      - caddy
    depends_on:
      - web
    restart: "no"

networks:
  caddy:
    external: true

volumes:
  # L'ultima build per cui si è svuotata la cache: un "up" senza build nuova non svuota.
  cloudflare-stato:
